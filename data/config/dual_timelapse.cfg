#####################################################################
# DUAL CAMERA TIMELAPSE
#
# CAM1 = 1 frame per layer
# CAM2 = 1 frame per x seconds
#####################################################################


#####################################################################
# Einstellungen
#####################################################################

[gcode_macro DUAL_TIMELAPSE]
variable_active: 0

variable_cam2_interval: 15

variable_cam1_frame: 0
variable_cam2_frame: 0

gcode:
    

#####################################################################
# Shell Command
#####################################################################

[gcode_shell_command dual_timelapse_capture]
command: /home/sonic/printer_data/scripts/dual_timelapse.sh
timeout: 10
verbose: False

#####################################################################
# Timelapse start
#####################################################################

[gcode_macro DUAL_TIMELAPSE_START]
description: start both cameras
gcode:
    RUN_SHELL_COMMAND CMD=dual_timelapse_capture PARAMS="cleanup"

    SET_GCODE_VARIABLE \
        MACRO=DUAL_TIMELAPSE \
        VARIABLE=cam1_frame \
        VALUE=0

    SET_GCODE_VARIABLE \
        MACRO=DUAL_TIMELAPSE \
        VARIABLE=cam2_frame \
        VALUE=0

    SET_GCODE_VARIABLE \
        MACRO=DUAL_TIMELAPSE \
        VARIABLE=active \
        VALUE=1

    UPDATE_DELAYED_GCODE \
        ID=dual_timelapse_cam2 \
        DURATION={printer["gcode_macro DUAL_TIMELAPSE"].cam2_interval}

    RESPOND MSG="Dual Timelapse gestartet - CAM2 alle {printer["gcode_macro DUAL_TIMELAPSE"].cam2_interval}s"


#####################################################################
# Timelapse stop
#####################################################################

[gcode_macro DUAL_TIMELAPSE_STOP]
description: Stoppt beide Kamera-Timelapses
gcode:
   
    UPDATE_DELAYED_GCODE ID=dual_timelapse_cam2 DURATION=0

    SET_GCODE_VARIABLE \
        MACRO=DUAL_TIMELAPSE \
        VARIABLE=active \
        VALUE=0

    RESPOND MSG="Dual Timelapse gestoppt"

[gcode_macro CAM1_LAYER_FRAME]
gcode:
    {% if printer["gcode_macro DUAL_TIMELAPSE"].active|int == 1 %}

        {% set frame =
            printer["gcode_macro DUAL_TIMELAPSE"].cam1_frame|int + 1 %}

        SET_GCODE_VARIABLE \
            MACRO=DUAL_TIMELAPSE \
            VARIABLE=cam1_frame \
            VALUE={frame}

        RUN_SHELL_COMMAND \
            CMD=dual_timelapse_capture \
            PARAMS="cam1 {frame}"

    {% endif %}


[delayed_gcode dual_timelapse_cam2]
gcode:
    {% if printer["gcode_macro DUAL_TIMELAPSE"].active|int == 1 %}

        {% set frame =
            printer["gcode_macro DUAL_TIMELAPSE"].cam2_frame|int + 1 %}

        SET_GCODE_VARIABLE \
            MACRO=DUAL_TIMELAPSE \
            VARIABLE=cam2_frame \
            VALUE={frame}

        RUN_SHELL_COMMAND \
            CMD=dual_timelapse_capture \
            PARAMS="cam2 {frame}"

        UPDATE_DELAYED_GCODE \
            ID=dual_timelapse_cam2 \
            DURATION={printer["gcode_macro DUAL_TIMELAPSE"].cam2_interval}

    {% endif %}


[gcode_macro CAM2_INTERVAL]
description: Setzt das Kamera-2-Intervall in Sekunden
gcode:
    {% if params.S is defined %}
        {% set interval = params.S|float %}

        {% if interval >= 1 %}
            SET_GCODE_VARIABLE \
                MACRO=DUAL_TIMELAPSE \
                VARIABLE=cam2_interval \
                VALUE={interval}

            RESPOND MSG="CAM2 Intervall: {interval} Sekunden"

        {% else %}
            RESPOND TYPE=error MSG="CAM2 Intervall muss mindestens 1 Sekunde sein"
        {% endif %}

    {% else %}
        RESPOND TYPE=error MSG="Benutzung: CAM2_INTERVAL S=15"
    {% endif %}


#####################################################################
# Status
#####################################################################

[gcode_macro DUAL_TIMELAPSE_STATUS]

gcode:
    {% set tl = printer["gcode_macro DUAL_TIMELAPSE"] %}

    RESPOND MSG="Timelapse aktiv={tl.active}, CAM1 Frames={tl.cam1_frame}, CAM2 Frames={tl.cam2_frame}, CAM2 Intervall={tl.cam2_interval}s"
