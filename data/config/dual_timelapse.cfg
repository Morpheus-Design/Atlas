#======================================================================================================================================================================================#
# DUAL CAMERA TIMELAPSE                                                                                                                                                                #
#                                                                                                                                                                                      #
# CAM_ONE = 1 frame per layer                                                                                                                                                          #
# CAM_TWO = 1 frame per x seconds                                                                                                                                                      #
#                                                                                                                                                                                      #
# To render use:                                                                                                                                                                       #
# ffmpeg -framerate 30 -i /home/sonic/printer_data/timelapse/cam1/%06d.jpg -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p /home/sonic/printer_data/timelapse/cam1_timelapse.mp4  #
#                                                                                                                                                                                      #
# and                                                                                                                                                                                  #
#                                                                                                                                                                                      #
# ffmpeg -framerate 30 -i /home/sonic/printer_data/timelapse/cam2/%06d.jpg -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p /home/sonic/printer_data/timelapse/cam2_timelapse.mp4  #
#                                                                                                                                                                                      #   
# Attention! At the start of every print the frame directories are cleared. This is done to not overload the memory of the pi and can be modified inside the dual_timelapse.sh script. #
#                                                                                                                                                                                      #
#======================================================================================================================================================================================#

[gcode_macro DUAL_TIMELAPSE]
variable_active: 0
variable_cam_two_interval: 15 # adjust to your prefered interval (in seconds, at least 1s)
variable_cam_one_frame: 0
variable_cam_two_frame: 0
gcode:


#####################################################################
# Shell Command
#####################################################################

[gcode_shell_command dual_timelapse_capture]
command: /home/sonic/printer_data/scripts/dual_timelapse.sh
timeout: 10
verbose: True


#####################################################################
# START
#####################################################################

[gcode_macro DUAL_TIMELAPSE_START]
gcode:
    RUN_SHELL_COMMAND CMD=dual_timelapse_capture PARAMS="cleanup"
    SET_GCODE_VARIABLE MACRO=DUAL_TIMELAPSE VARIABLE=cam_one_frame VALUE=0
    SET_GCODE_VARIABLE MACRO=DUAL_TIMELAPSE VARIABLE=cam_two_frame VALUE=0
    SET_GCODE_VARIABLE MACRO=DUAL_TIMELAPSE VARIABLE=active VALUE=1
    UPDATE_DELAYED_GCODE ID=dual_timelapse_cam_two DURATION={printer["gcode_macro DUAL_TIMELAPSE"].cam_two_interval}
    RESPOND MSG="Dual Timelapse started"


#####################################################################
# STOP
#####################################################################

[gcode_macro DUAL_TIMELAPSE_STOP]
gcode:
    UPDATE_DELAYED_GCODE ID=dual_timelapse_cam_two DURATION=0
    SET_GCODE_VARIABLE MACRO=DUAL_TIMELAPSE VARIABLE=active VALUE=0
    RESPOND MSG="Dual Timelapse stopped"


#####################################################################
# CAM1
#####################################################################

[gcode_macro CAM_ONE_LAYER_FRAME]
gcode:
    {% if printer["gcode_macro DUAL_TIMELAPSE"].active|int == 1 %}
        {% set frame = printer["gcode_macro DUAL_TIMELAPSE"].cam_one_frame|int + 1 %}
        SET_GCODE_VARIABLE MACRO=DUAL_TIMELAPSE VARIABLE=cam_one_frame VALUE={frame}
        RUN_SHELL_COMMAND CMD=dual_timelapse_capture PARAMS="cam1 {frame}"
    {% endif %}


#####################################################################
# CAM2
#####################################################################

[delayed_gcode dual_timelapse_cam_two]
gcode:
    {% if printer["gcode_macro DUAL_TIMELAPSE"].active|int == 1 %}
        {% set frame = printer["gcode_macro DUAL_TIMELAPSE"].cam_two_frame|int + 1 %}
        SET_GCODE_VARIABLE MACRO=DUAL_TIMELAPSE VARIABLE=cam_two_frame VALUE={frame}
        RUN_SHELL_COMMAND CMD=dual_timelapse_capture PARAMS="cam2 {frame}"
        UPDATE_DELAYED_GCODE ID=dual_timelapse_cam_two DURATION={printer["gcode_macro DUAL_TIMELAPSE"].cam_two_interval}
    {% endif %}


#####################################################################
# CAM2 INTERVALL
#####################################################################

[gcode_macro CAM_TWO_INTERVAL]
gcode:
    {% if params.S is defined %}
        {% set interval = params.S|float %}
        {% if interval >= 1 %}
            SET_GCODE_VARIABLE MACRO=DUAL_TIMELAPSE VARIABLE=cam_two_interval VALUE={interval}
            RESPOND MSG="CAM_TWO Intervall auf {interval} Sekunden gesetzt"
        {% else %}
            RESPOND TYPE=error MSG="CAM_TWO interval must be at least 1 second"
        {% endif %}
    {% else %}
        RESPOND TYPE=error MSG="Use: CAM_TWO_INTERVAL S=15"
    {% endif %}


#####################################################################
# STATUS
#####################################################################

[gcode_macro DUAL_TIMELAPSE_STATUS]
gcode:
    {% set tl = printer["gcode_macro DUAL_TIMELAPSE"] %}
    RESPOND MSG="Active={tl.active} CAM1={tl.cam_one_frame} CAM2={tl.cam_two_frame} Interval={tl.cam_two_interval}s"