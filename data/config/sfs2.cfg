[gcode_macro PRINT_pause]
gcode: 
  {% if not printer.pause_resume.is_paused %}
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0
    SET_FILAMENT_SENSOR SENSOR=switch_sensor ENABLE=0
    LED_state_save
    SET_PIN PIN=expander_LED_red VALUE=0.5
    SET_PIN PIN=expander_LED_green VALUE=0.5
    SET_PIN PIN=expander_LED_blue VALUE=0
    SET_PIN PIN=expander_LED_nozzle VALUE=0.5
    M117 Filament removed, stuck or runout
    LED_yellow_on_no_save
    LED_nozzle_on_no_save 
    PAUSE VELOCITY=250
  {% endif %}

[gcode_macro PRINT_resume]
gcode:
    SET_FILAMENT_SENSOR SENSOR=switch_sensor ENABLE=1
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=1
    LED_state_restore
    RESUME

[filament_switch_sensor switch_sensor]
switch_pin: ^PB15
pause_on_runout: False
runout_gcode:
  RESPOND PREFIX="DEBUG:" MSG="switch sensor triggered"
  M118 switch sensor triggered, pausing the print
  PRINT_pause
insert_gcode:
  M117 Filament inserted
  PRINT_resume

[filament_motion_sensor encoder_sensor]
switch_pin: ^PB12
detection_length: 4.00
extruder: extruder
pause_on_runout: False
runout_gcode:
  RESPOND PREFIX="DEBUG:" MSG="encoder sensor triggered"
  M118 encoder sensor triggered, pausing print
  PRINT_pause
insert_gcode:
  M117 Filament inserted
  PRINT_resume